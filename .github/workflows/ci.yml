name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch reference sources (CBA_A3, ACE3, Antistasi Ultimate, Arma 3 wiki)
        run: |
          git clone --depth 1 https://github.com/CBATeam/CBA_A3.git ../src/cba
          git clone --depth 1 https://github.com/acemod/ACE3.git ../src/ace
          git clone --depth 1 https://github.com/SilenceIsFatto/A3-Antistasi-Ultimate.git ../src/antistasi
          git clone --depth 1 -b dist https://github.com/acemod/arma3-wiki.git ../src/wiki

      - name: Static checks
        run: python3 tests/static_checks.py --cba ../src/cba --ace ../src/ace --antistasi ../src/antistasi --wiki ../src/wiki

      - uses: arma-actions/hemtt@v1
        name: Setup HEMTT

      - name: HEMTT check (pedantic, warnings are errors)
        run: hemtt check --pedantic --error-on-all

      - name: Compile in-game test scripts
        run: tools/check_ingame_scripts.sh

      - name: HEMTT release build
        run: hemtt release

      - uses: actions/upload-artifact@v4
        with:
          name: auqol
          path: releases/auqol-latest.zip

      # A push to main whose script_version.hpp has no release yet publishes one, tagged v<version>, with the zip.
      - name: Check for an unreleased version
        id: version
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(awk '/#define (MAJOR|MINOR|PATCH)/ {printf "%s%s", sep, $3; sep="."}' addons/main/script_version.hpp)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi

      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.new == 'true'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.version }}
          body: See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
          files: releases/auqol-${{ steps.version.outputs.version }}.zip
